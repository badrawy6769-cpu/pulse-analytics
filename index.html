<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in · Pulse Analytics</title>
<meta name="description" content="Log in to Pulse — subscription analytics dashboard." />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div class="brand-name">Pulse Analytics</div>
    </div>
    <h1>Welcome back</h1>
    <p class="auth-subtitle">Log in to view your subscription metrics.</p>

    <div class="form-alert" id="form-alert" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="you@company.com" required />
        <div class="field-error" id="email-error"></div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required />
        <div class="field-error" id="password-error"></div>
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">Log in</button>
    </form>

    <div class="demo-hint">
      Demo account: <code>demo@subanalytics.io</code> / <code>Demo1234</code>
    </div>

    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Sign up</a>
    </div>
  </div>

  <script type="module">
    import { login, AuthError, isAuthenticated } from './js/auth.js';

    // Already logged in? Skip straight to the dashboard.
    if (isAuthenticated()) {
      window.location.href = 'dashboard.html';
    }

    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('form-alert');
    const submitBtn = document.getElementById('submit-btn');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    function clearErrors() {
      alertBox.classList.remove('visible', 'success');
      alertBox.textContent = '';
      [emailInput, passwordInput].forEach((el) => el.classList.remove('invalid'));
    }

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.classList.add('visible');
      if (type === 'success') alertBox.classList.add('success');
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      clearErrors();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in…';

      try {
        login({ email: emailInput.value, password: passwordInput.value });
        window.location.href = 'dashboard.html';
      } catch (err) {
        if (err instanceof AuthError) {
          showAlert(err.message);
          emailInput.classList.add('invalid');
          passwordInput.classList.add('invalid');
        } else {
          showAlert('Something went wrong. Please try again.');
          console.error(err);
        }
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
